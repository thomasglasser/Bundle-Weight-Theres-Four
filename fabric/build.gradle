plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id "bundlefour-loader"
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
	implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

	include implementation("dev.thomasglasser.tommylib:tommylib-fabric-${minecraft_version}:${tommylib_version}")
	include implementation("dev.thomasglasser.bundleweight:bundleweight-fabric-${minecraft_version}:${bundleweight_version}")

	// Runtime
	localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
	localRuntime "maven.modrinth:jade:${jade_version}+fabric"
//	localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

loom {
	def aw = file("src/main/resources/${mod_id}.accesswidener")
	if (aw.exists()) {
		accessWidenerPath.set(aw)
	}

	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated(true)
			runDir("runs/client")
		}
		client_alt {
			client()
			setConfigName("Fabric Client 2")
			ideConfigGenerated(true)
			runDir("runs/client_alt")
		}
		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated(true)
			runDir("runs/server")
		}
	}
}

build.dependsOn validateAccessWidener
